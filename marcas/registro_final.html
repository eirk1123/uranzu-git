<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - Uranzu</title>

  <!-- Bootstrap (para maquetación rápida) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Vuestro CSS -->
  <link rel="stylesheet" href="stylesprint.css">
</head>
<body>
  <header>
    <div class="top-bar">
      <div class="logo">
        <h1>Uranzu Transporte Logístico</h1>
      </div>
    </div>
  </header>

  <main class="container my-4">
    <section class="p-4">
      <h2>Registrarse</h2>

      <!-- Mensajes de validación -->
      <div id="errores" class="alert alert-danger d-none" role="alert"></div>
      <div id="ok" class="alert alert-success d-none" role="alert">Formulario correcto. Enviando…</div>

      <form id="formRegistro" action="exito_inicio.html" method="get" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input id="nombre" name="nombre" type="text" class="form-control" required minlength="2" maxlength="40" placeholder="Tu nombre">
          <div class="form-text">Entre 2 y 40 caracteres.</div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control" required placeholder="nombre@correo.com">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" name="password" type="password" class="form-control" required minlength="8" maxlength="64" placeholder="Mínimo 8 caracteres">
          <div class="form-text">Mínimo 8 caracteres, con letras y números.</div>
        </div>

        <button type="submit" class="btn btn-primary">Crear cuenta</button>
        <a class="btn btn-link" href="sprint2_final.html">Volver a la página principal</a>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 Uranzu Transporte Logístico</p>
  </footer>

  <script src="validar.js" defer></script>
</body>
</html>
