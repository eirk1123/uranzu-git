<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - Uranzu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="stylesprint.css">
</head>
<body>
  <header>
    <div class="top-bar">
      <div class="logo">
        <h1>Uranzu Transporte Logístico</h1>
      </div>
    </div>
  </header>

  <main class="container my-4">
    <section class="p-4">
      <h2>Registrarse</h2>

      <div id="errores" class="alert alert-danger d-none" role="alert"></div>

      <!-- Formulario -->
      <form id="formRegistro" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input id="nombre" type="text" class="form-control" required minlength="2" maxlength="40" placeholder="Tu nombre">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" required placeholder="nombre@correo.com">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" required minlength="8" placeholder="Mínimo 8 caracteres">
        </div>
        <button type="submit" class="btn btn-primary">Crear cuenta</button>
        <a class="btn btn-link" href="index.html">Volver a la página principal</a>
      </form>

      <!-- Mensaje de éxito (oculto hasta que se envíe bien) -->
      <div id="exito" class="d-none" style="text-align:center; padding:2rem 0;">
        <div style="font-size:3rem;">✅</div>
        <h3 style="margin-top:1rem;">¡Cuenta creada con éxito!</h3>
        <p style="color:var(--color-texto-suave);">Bienvenido a Uranzu Transporte Logístico.</p>
        <a href="index.html" class="btn btn-primary" style="margin-top:1rem;">Volver a la web</a>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Uranzu Transporte Logístico</p>
  </footer>

  <script>
    document.getElementById('formRegistro').addEventListener('submit', function(e) {
      e.preventDefault();

      const nombre   = document.getElementById('nombre').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errores  = [];

      // Validaciones
      if (nombre.length < 2 || nombre.length > 40)
        errores.push('El nombre debe tener entre 2 y 40 caracteres.');

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))
        errores.push('El email no tiene un formato válido.');

      if (password.length < 8)
        errores.push('La contraseña debe tener mínimo 8 caracteres.');

      if (!/[A-Za-z]/.test(password) || !/\d/.test(password))
        errores.push('La contraseña debe incluir letras y números.');

      const boxErrores = document.getElementById('errores');

      if (errores.length > 0) {
        boxErrores.classList.remove('d-none');
        boxErrores.innerHTML = '<strong>Revisa esto:</strong><ul class="mb-0">' +
          errores.map(e => `<li>${e}</li>`).join('') + '</ul>';
        return;
      }

      // Todo correcto: ocultar form y mostrar éxito
      boxErrores.classList.add('d-none');
      document.getElementById('formRegistro').classList.add('d-none');
      document.getElementById('exito').classList.remove('d-none');
    });
  </script>
</body>
</html>
